<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Shifter Search</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Changed background to solid white for Notion Light Mode */
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        /* The Custom Google-Style Search Bar container */
        .search-container {
            display: flex;
            align-items: center;
            width: 90%;
            max-width: 500px;
            height: 46px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            padding: 0 16px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.05);
            transition: all 0.2s ease;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Subtle glow when clicked/hovered */
        .search-container:hover, .search-container:active {
            box-shadow: 0 1px 8px rgba(32, 33, 36, 0.12);
            border-color: #f5d1dc;
        }

        /* Google Search Icon (Left) styled in light gray */
        .search-icon {
            color: #9aa0a6;
            margin-right: 12px;
            display: flex;
            align-items: center;
            user-select: none;
        }

        /* The simulated input text area styled in your Pastel Pink */
        .search-text {
            color: #F5D1DC; /* Your custom pastel pink */
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid transparent; /* The typing cursor */
            letter-spacing: 0.5px;
            flex-grow: 1;
            user-select: none;
        }

        /* Blinking cursor animation during typing */
        .typing {
            border-right-color: #F5D1DC;
            animation: blink 0.6s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #F5D1DC; }
        }
    </style>
</head>
<body>

    <div class="search-container" id="searchBar">
        <div class="search-icon">
            <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
            </svg>
        </div>
        <div class="search-text" id="searchText">Search...</div>
    </div>

    <script>
        // Your list of phrases to cycle through randomly
        const phrases = [
            "all about our star shifter",
            "tell me about our star shifter",
            "our favorite star",
            "where is our star shifter from?",
            "how to be like our star shifter"
        ];

        let lastPhrase = "";
        const searchText = document.getElementById('searchText');
        const searchBar = document.getElementById('searchBar');

        function getRandomPhrase() {
            // Filter out the last used phrase so it always picks a different one on click
            let availablePhrases = phrases.filter(p => p !== lastPhrase);
            const randomIndex = Math.floor(Math.random() * availablePhrases.length);
            lastPhrase = availablePhrases[randomIndex];
            return lastPhrase;
        }

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                searchText.innerHTML = text.substring(0, i + 1);
                setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, 75); // Speed of typing (75ms per character)
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 700);
            }
        }

        function startTypingAnimation() {
            searchText.classList.add('typing');
            const selectedText = getRandomPhrase();
            
            // Start character-by-character typing loop
            typeWriter(selectedText, 0, function() {
                // Remove blinking cursor when typing is finished
                searchText.classList.remove('typing');
            });
        }

        // Triggers the randomized typing whenever the bar is clicked
        searchBar.addEventListener('click', () => {
            searchText.innerHTML = ""; // Clear existing text immediately
            startTypingAnimation();
        });
    </script>

</body>
</html>
